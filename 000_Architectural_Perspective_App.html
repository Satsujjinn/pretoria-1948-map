<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Architectural Perspective De-Skewing Studio</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #121212; color: #f0f0f0; margin: 0; padding: 14px; display: flex; flex-direction: column; align-items: center; }
  .card { background: #1e1e1e; border-radius: 14px; padding: 18px; width: 100%; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px 0; color: #ffb300; }
  p.sub { font-size: 13px; color: #aaa; margin: 0 0 14px 0; }
  label.btn, button.btn { display: block; width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; text-align: center; cursor: pointer; margin-bottom: 10px; }
  .btn-primary { background: #ff8f00; color: #000; }
  .btn-secondary { background: #2c2c2e; color: #fff; border: 1px solid #444; }
  input[type="file"] { display: none; }
  .telemetry { background: #000; border: 1px solid #333; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; color: #ffb300; margin-bottom: 12px; display: none; line-height: 1.5; }
  canvas { width: 100%; border-radius: 8px; border: 1px solid #333; display: none; margin-bottom: 12px; touch-action: none; }
  .controls { display: none; gap: 8px; flex-direction: column; }
  .opt-row { display: none; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px; background: #262629; padding: 10px 12px; border-radius: 8px; }
  select, input[type="range"] { background: #121212; color: #fff; border: 1px solid #555; padding: 6px 10px; border-radius: 6px; font-weight: 600; width: 130px; }
  input[type="range"] { accent-color: #ff8f00; width: 45%; }
  .val-display { font-family: monospace; color: #ffb300; font-size: 12px; }
</style>
</head>
<body>

<div class="card">
  <h1>Perspective De-Skew Studio</h1>
  <p class="sub">Float64 4-Corner Homography & Architectural Cleanup</p>

  <label class="btn btn-primary">
    Select Angled Blueprint / Sketch Photo
    <input type="file" id="fileInput" accept="image/*">
  </label>

  <div class="opt-row" id="modeRow">
    <span>Filter Style:</span>
    <select id="modeSelect">
      <option value="blueprint">Blueprint Cyan Line</option>
      <option value="sketch" selected>Monochrome Ink Draft</option>
      <option value="raw">Raw Flattened Color</option>
    </select>
  </div>

  <div class="opt-row" id="contrastRow">
    <span>Line Crispness:</span>
    <input type="range" id="contrastSlider" min="1.0" max="2.5" step="0.1" value="1.6">
    <span class="val-display" id="contrastVal">1.6x</span>
  </div>

  <div id="telemetry" class="telemetry">Tip: Drag the 4 corner handles to match document boundaries, then hit Flatten.</div>
  <canvas id="canvas"></canvas>

  <div id="controls" class="controls">
    <button class="btn btn-primary" id="flattenBtn">Apply Perspective Flattening</button>
    <button class="btn btn-secondary" id="resetBtn" style="display:none;">Reset Corner Pins</button>
    <button class="btn btn-secondary" id="saveJpgBtn">Download Flattened Plan (JPG)</button>
    <button class="btn btn-secondary" id="savePdfBtn">Save as Architectural PDF</button>
  </div>
</div>

<script>
const MAX_CANVAS_PIXELS = 16777216;
const fileInput = document.getElementById('fileInput');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const telemetry = document.getElementById('telemetry');
const controls = document.getElementById('controls');
const modeSelect = document.getElementById('modeSelect');
const contrastSlider = document.getElementById('contrastSlider');
const contrastVal = document.getElementById('contrastVal');
const flattenBtn = document.getElementById('flattenBtn');
const resetBtn = document.getElementById('resetBtn');

let loadedImg = null;
let srcData = null;
let sw = 0, sh = 0;
let corners = [];
let draggingIdx = null;
let isFlattened = false;

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      loadedImg = img;
      let w = img.width, h = img.height;
      if (w * h > MAX_CANVAS_PIXELS) {
        const ratio = Math.sqrt(MAX_CANVAS_PIXELS / (w * h));
        w = Math.floor(w * ratio);
        h = Math.floor(h * ratio);
      }
      sw = w; sh = h;
      const off = document.createElement('canvas');
      off.width = sw; off.height = sh;
      const octx = off.getContext('2d');
      octx.drawImage(img, 0, 0, sw, sh);
      srcData = octx.getImageData(0, 0, sw, sh).data;

      document.getElementById('modeRow').style.display = 'flex';
      document.getElementById('contrastRow').style.display = 'flex';

      corners = [
        {x: sw * 0.15, y: sh * 0.15},
        {x: sw * 0.85, y: sh * 0.15},
        {x: sw * 0.85, y: sh * 0.85},
        {x: sw * 0.15, y: sh * 0.85}
      ];

      isFlattened = false;
      resetBtn.style.display = 'none';
      drawImageWithCorners();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

modeSelect.addEventListener('change', () => { if (isFlattened) triggerWarp(); });
contrastSlider.addEventListener('input', () => {
  contrastVal.innerText = contrastSlider.value + 'x';
  if (isFlattened) triggerWarp();
});

resetBtn.addEventListener('click', () => {
  if (!loadedImg) return;
  isFlattened = false;
  resetBtn.style.display = 'none';
  telemetry.innerHTML = 'Tip: Drag the 4 corner handles to match document boundaries, then hit Flatten.';
  drawImageWithCorners();
});

function drawImageWithCorners() {
  if (!loadedImg) return;
  canvas.width = sw;
  canvas.height = sh;
  canvas.style.display = 'block';
  telemetry.style.display = 'block';
  controls.style.display = 'flex';

  ctx.clearRect(0, 0, sw, sh);
  ctx.drawImage(loadedImg, 0, 0, sw, sh);

  ctx.strokeStyle = '#ff8f00';
  ctx.lineWidth = Math.max(3, sw * 0.005);
  ctx.beginPath();
  ctx.moveTo(corners[0].x, corners[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
  ctx.closePath();
  ctx.stroke();

  const radius = Math.max(15, sw * 0.02);
  corners.forEach((c, idx) => {
    ctx.fillStyle = '#ff8f00';
    ctx.beginPath();
    ctx.arc(c.x, c.y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#000';
    ctx.font = 'bold ' + Math.max(12, Math.floor(radius * 0.9)) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(idx + 1, c.x, c.y);
  });
}

function getTouchPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * (canvas.width / rect.width),
    y: (clientY - rect.top) * (canvas.height / rect.height)
  };
}

canvas.addEventListener('pointerdown', e => {
  if (isFlattened) return;
  const pos = getTouchPos(e);
  const hitRadius = Math.max(40, canvas.width * 0.05);
  let bestDist = Infinity;
  corners.forEach((c, idx) => {
    const dist = Math.hypot(c.x - pos.x, c.y - pos.y);
    if (dist < hitRadius && dist < bestDist) {
      bestDist = dist;
      draggingIdx = idx;
    }
  });
});

canvas.addEventListener('pointermove', e => {
  if (draggingIdx === null || isFlattened) return;
  const pos = getTouchPos(e);
  corners[draggingIdx].x = Math.max(0, Math.min(canvas.width, pos.x));
  corners[draggingIdx].y = Math.max(0, Math.min(canvas.height, pos.y));
  drawImageWithCorners();
});

window.addEventListener('pointerup', () => { draggingIdx = null; });
window.addEventListener('pointercancel', () => { draggingIdx = null; });

function solveHomographyFloat64(srcPts, dstPts) {
  const M = new Float64Array(72);
  for (let i = 0; i < 4; i++) {
    const x = dstPts[i].x, y = dstPts[i].y;
    const X = srcPts[i].x, Y = srcPts[i].y;

    const r1 = (i * 2) * 9;
    M[r1 + 0] = x; M[r1 + 1] = y; M[r1 + 2] = 1;
    M[r1 + 6] = -x * X; M[r1 + 7] = -y * X; M[r1 + 8] = X;

    const r2 = (i * 2 + 1) * 9;
    M[r2 + 3] = x; M[r2 + 4] = y; M[r2 + 5] = 1;
    M[r2 + 6] = -x * Y; M[r2 + 7] = -y * Y; M[r2 + 8] = Y;
  }

  for (let i = 0; i < 8; i++) {
    let maxRow = i;
    let maxVal = Math.abs(M[i * 9 + i]);
    for (let k = i + 1; k < 8; k++) {
      const val = Math.abs(M[k * 9 + i]);
      if (val > maxVal) { maxVal = val; maxRow = k; }
    }
    if (maxRow !== i) {
      for (let j = i; j <= 8; j++) {
        const tmp = M[i * 9 + j];
        M[i * 9 + j] = M[maxRow * 9 + j];
        M[maxRow * 9 + j] = tmp;
      }
    }
    const pivot = M[i * 9 + i] || 1e-14;
    for (let k = i + 1; k < 8; k++) {
      const factor = M[k * 9 + i] / pivot;
      M[k * 9 + i] = 0.0;
      for (let j = i + 1; j <= 8; j++) {
        M[k * 9 + j] -= factor * M[i * 9 + j];
      }
    }
  }

  const h = new Float64Array(9);
  for (let i = 7; i >= 0; i--) {
    let sum = M[i * 9 + 8];
    for (let j = i + 1; j < 8; j++) {
      sum -= M[i * 9 + j] * h[j];
    }
    h[i] = sum / (M[i * 9 + i] || 1e-14);
  }
  h[8] = 1.0;
  return h;
}

function triggerWarp() {
  if (!loadedImg || !srcData) return;
  telemetry.innerHTML = 'PROCESSING: Computing Float64 Homography Matrix...';
  requestAnimationFrame(() => requestAnimationFrame(applyWarpAndFilter));
}

function applyWarpAndFilter() {
  const t0 = performance.now();
  const mode = modeSelect.value;
  const contrast = parseFloat(contrastSlider.value);

  const wTop = Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y);
  const wBot = Math.hypot(corners[2].x - corners[3].x, corners[2].y - corners[3].y);
  const hLeft = Math.hypot(corners[3].x - corners[0].x, corners[3].y - corners[0].y);
  const hRight = Math.hypot(corners[2].x - corners[1].x, corners[2].y - corners[1].y);

  let outW = Math.max(50, Math.round((wTop + wBot) / 2));
  let outH = Math.max(50, Math.round((hLeft + hRight) / 2));
  if (outW * outH > MAX_CANVAS_PIXELS) {
    const ratio = Math.sqrt(MAX_CANVAS_PIXELS / (outW * outH));
    outW = Math.floor(outW * ratio);
    outH = Math.floor(outH * ratio);
  }

  const dstPts = [
    {x: 0, y: 0},
    {x: outW - 1, y: 0},
    {x: outW - 1, y: outH - 1},
    {x: 0, y: outH - 1}
  ];

  const H = solveHomographyFloat64(corners, dstPts);
  const h0 = H[0], h1 = H[1], h2 = H[2], h3 = H[3], h4 = H[4], h5 = H[5], h6 = H[6], h7 = H[7];

  canvas.width = outW;
  canvas.height = outH;
  const outImgData = ctx.createImageData(outW, outH);
  const d = outImgData.data;

  for (let y = 0; y < outH; y++) {
    const rowY_X = h1 * y + h2;
    const rowY_Y = h4 * y + h5;
    const rowY_W = h7 * y + 1.0;

    for (let x = 0; x < outW; x++) {
      const denom = h6 * x + rowY_W;
      const invDenom = Math.abs(denom) > 1e-12 ? (1.0 / denom) : 0.0;
      const sx = (h0 * x + rowY_X) * invDenom;
      const sy = (h3 * x + rowY_Y) * invDenom;

      const x0 = Math.floor(sx), y0 = Math.floor(sy);
      let r = 255, g = 255, b = 255;

      if (x0 >= 0 && x0 < sw - 1 && y0 >= 0 && y0 < sh - 1) {
        const dx = sx - x0, dy = sy - y0;
        const w00 = (1 - dx) * (1 - dy);
        const w10 = dx * (1 - dy);
        const w01 = (1 - dx) * dy;
        const w11 = dx * dy;

        const i00 = (y0 * sw + x0) << 2;
        const i10 = i00 + 4;
        const i01 = i00 + (sw << 2);
        const i11 = i01 + 4;

        r = srcData[i00] * w00 + srcData[i10] * w10 + srcData[i01] * w01 + srcData[i11] * w11;
        g = srcData[i00+1] * w00 + srcData[i10+1] * w10 + srcData[i01+1] * w01 + srcData[i11+1] * w11;
        b = srcData[i00+2] * w00 + srcData[i10+2] * w10 + srcData[i01+2] * w01 + srcData[i11+2] * w11;
      }

      const dstIdx = (y * outW + x) << 2;
      const gray = 0.299 * r + 0.587 * g + 0.114 * b;

      if (mode === 'sketch') {
        let val = ((gray / 255 - 0.5) * contrast + 0.5) * 255;
        val = val > 200 ? 255 : (val < 50 ? 0 : val);
        d[dstIdx] = val; d[dstIdx+1] = val; d[dstIdx+2] = val;
      } else if (mode === 'blueprint') {
        const norm = Math.min(255, Math.max(0, (255 - gray) * contrast));
        d[dstIdx] = norm * 0.1;
        d[dstIdx+1] = norm * 0.5;
        d[dstIdx+2] = norm * 0.95;
      } else {
        d[dstIdx] = Math.min(255, Math.max(0, ((r / 255 - 0.5) * contrast + 0.5) * 255));
        d[dstIdx+1] = Math.min(255, Math.max(0, ((g / 255 - 0.5) * contrast + 0.5) * 255));
        d[dstIdx+2] = Math.min(255, Math.max(0, ((b / 255 - 0.5) * contrast + 0.5) * 255));
      }
      d[dstIdx+3] = 255;
    }
  }

  ctx.putImageData(outImgData, 0, 0);
  isFlattened = true;
  resetBtn.style.display = 'block';
  const dt = (performance.now() - t0).toFixed(0);
  telemetry.innerHTML = `SUCCESS: De-Skewed to ${outW}x${outH} px (${dt} ms).`;
}

flattenBtn.addEventListener('click', triggerWarp);

document.getElementById('saveJpgBtn').addEventListener('click', () => {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = '000_FLATTENED_ARCHITECTURAL_PLAN.jpg';
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }, 'image/jpeg', 0.98);
});

document.getElementById('savePdfBtn').addEventListener('click', () => {
  const dataUrl = canvas.toDataURL('image/jpeg', 0.98);
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>Architectural Plan PDF</title><style>@page { size: auto; margin: 0; } body { margin: 0; display:flex; justify-content:center; align-items:center; height:100vh; background:#000; } img { max-width: 100%; max-height: 100%; object-fit: contain; }</style></head><body><img src="${dataUrl}" onload="window.print();"></body></html>`);
  win.document.close();
});
</script>
</body>
</html>
