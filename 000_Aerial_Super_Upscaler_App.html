<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aerial Super-Upscaler & Collinearity Ortho-Rectifier</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #121212; color: #f0f0f0; margin: 0; padding: 14px; display: flex; flex-direction: column; align-items: center; }
  .card { background: #1e1e1e; border-radius: 14px; padding: 18px; width: 100%; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px 0; color: #00e676; }
  p.sub { font-size: 13px; color: #aaa; margin: 0 0 14px 0; }
  label.btn, button.btn { display: block; width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; text-align: center; cursor: pointer; margin-bottom: 10px; }
  .btn-primary { background: #00c853; color: #000; }
  .btn-accent { background: #ff9100; color: #000; }
  .btn-secondary { background: #2c2c2e; color: #fff; border: 1px solid #444; }
  input[type="file"] { display: none; }
  .telemetry { background: #000; border: 1px solid #333; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; color: #00e676; margin-bottom: 12px; display: none; line-height: 1.5; }
  canvas { width: 100%; border-radius: 8px; border: 1px solid #333; display: none; margin-bottom: 12px; }
  .controls { display: none; gap: 8px; flex-direction: column; }
  .opt-row { display: none; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px; background: #262629; padding: 10px 12px; border-radius: 8px; }
  select, input[type="number"] { background: #121212; color: #fff; border: 1px solid #555; padding: 6px 10px; border-radius: 6px; font-weight: 600; width: 110px; text-align: right; }
</style>
</head>
<body>

<div class="card">
  <h1>Aerial Super-Upscaler V2</h1>
  <p class="sub">Collinearity Homography + Sub-Pixel Inclinometer + Isotropic Unsharp</p>

  <label class="btn btn-primary">
    Select Historical Plate (Job D147)
    <input type="file" id="fileInput" accept="image/*">
  </label>

  <button class="btn btn-accent" id="calcParamsBtn" style="display:none;">
    Auto-Calculate Focal, GSD & Height from Plate
  </button>

  <div class="opt-row" id="heightRow">
    <span>Flight Height (H meters):</span>
    <input type="number" id="flightHeightInput" value="3000" step="10">
  </div>

  <div class="opt-row" id="focalRow">
    <span>Focal Length (f mm):</span>
    <input type="number" id="focalLengthInput" value="152.4" step="0.1">
  </div>

  <div class="opt-row" id="scaleRow">
    <span>Super-Sample Scale:</span>
    <select id="scaleSelect">
      <option value="1">1x (Original Res)</option>
      <option value="2" selected>2x Super-Sampled</option>
      <option value="3">3x Archival Max</option>
    </select>
  </div>

  <div class="opt-row" id="sharpRow">
    <span>Isotropic Edge Recovery:</span>
    <input type="checkbox" id="sharpToggle" checked style="transform:scale(1.4);">
  </div>

  <div class="opt-row" id="markRow">
    <span>Instrument Target Grid:</span>
    <input type="checkbox" id="redMarkToggle" checked style="transform:scale(1.4);">
  </div>

  <div id="telemetry" class="telemetry"></div>
  <canvas id="canvas"></canvas>

  <div id="controls" class="controls">
    <button class="btn btn-primary" id="saveJpgBtn">Download Upscaled Map (JPG)</button>
    <button class="btn btn-secondary" id="savePdfBtn">Print / Save Square PDF</button>
  </div>
</div>

<script>
const MAX_PIXELS = 16777216;
const fileInput = document.getElementById('fileInput');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const telemetry = document.getElementById('telemetry');
const controls = document.getElementById('controls');
const calcParamsBtn = document.getElementById('calcParamsBtn');
const scaleSelect = document.getElementById('scaleSelect');
const sharpToggle = document.getElementById('sharpToggle');
const redMarkToggle = document.getElementById('redMarkToggle');
const flightHeightInput = document.getElementById('flightHeightInput');
const focalLengthInput = document.getElementById('focalLengthInput');
let loadedImg = null;

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      loadedImg = img;
      calcParamsBtn.style.display = 'block';
      ['heightRow', 'focalRow', 'scaleRow', 'sharpRow', 'markRow'].forEach(id => {
        document.getElementById(id).style.display = 'flex';
      });
      autoCalculateParameters();
      processImage();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function autoCalculateParameters() {
  if (!loadedImg) return;
  const maxDim = Math.max(loadedImg.width, loadedImg.height);
  const negativeSizeMM = 228.6; // 9x9 inch aerial contact print format
  const standardFocalMM = 152.4; // 6-inch Williamson Eagle IX / Wild RC5 lens
  const estimatedScaleDenominator = Math.round((maxDim / negativeSizeMM) * 12000);
  const calculatedHeight = Math.round((standardFocalMM * estimatedScaleDenominator) / 1000);
  focalLengthInput.value = standardFocalMM.toFixed(1);
  flightHeightInput.value = Math.max(1500, Math.min(8000, calculatedHeight));
}

calcParamsBtn.addEventListener('click', () => { autoCalculateParameters(); processImage(); });
scaleSelect.addEventListener('change', () => { if (loadedImg) processImage(); });
sharpToggle.addEventListener('change', () => { if (loadedImg) processImage(); });
redMarkToggle.addEventListener('change', () => { if (loadedImg) processImage(); });
flightHeightInput.addEventListener('input', () => { if (loadedImg) processImage(); });
focalLengthInput.addEventListener('input', () => { if (loadedImg) processImage(); });

function applyIsotropicSobelSharpen(context, w, h) {
  const srcData = context.getImageData(0, 0, w, h);
  const dstData = context.createImageData(w, h);
  const src = srcData.data, dst = dstData.data;
  const amount = 0.42;

  for (let y = 1; y < h - 1; y++) {
    const row = y * w, rowUp = (y - 1) * w, rowDn = (y + 1) * w;
    for (let x = 1; x < w - 1; x++) {
      const i00 = (rowUp + x - 1) * 4, i10 = (rowUp + x) * 4, i20 = (rowUp + x + 1) * 4;
      const i01 = (row + x - 1) * 4,   i11 = (row + x) * 4,   i21 = (row + x + 1) * 4;
      const i02 = (rowDn + x - 1) * 4, i12 = (rowDn + x) * 4, i22 = (rowDn + x + 1) * 4;

      const gx = (src[i20+1] + 2*src[i21+1] + src[i22+1]) - (src[i00+1] + 2*src[i01+1] + src[i02+1]);
      const gy = (src[i02+1] + 2*src[i12+1] + src[i22+1]) - (src[i00+1] + 2*src[i10+1] + src[i20+1]);
      const grad = Math.hypot(gx, gy) * 0.25;
      const gate = grad > 8 ? Math.min(1.0, (grad - 8) / 28.0) : 0.0;

      for (let c = 0; c < 3; c++) {
        const center = src[i11 + c];
        const isoNeighbors = (
          (src[i10 + c] + src[i12 + c] + src[i01 + c] + src[i21 + c]) * 0.15 +
          (src[i00 + c] + src[i20 + c] + src[i02 + c] + src[i22 + c]) * 0.10
        );
        const val = center + (center - isoNeighbors) * (amount * 3.5 * gate);
        dst[i11 + c] = val < 0 ? 0 : (val > 255 ? 255 : val);
      }
      dst[i11 + 3] = 255;
    }
  }
  context.putImageData(dstData, 0, 0);
}

function processImage() {
  const scale = parseInt(scaleSelect.value, 10);
  const H = parseFloat(flightHeightInput.value) || 3000;
  const f = parseFloat(focalLengthInput.value) || 152.4;

  const w0 = loadedImg.width, h0 = loadedImg.height;
  let w = w0 * scale, h = h0 * scale;
  if (w * h > MAX_PIXELS) {
    const ratio = Math.sqrt(MAX_PIXELS / (w * h));
    w = Math.floor(w * ratio);
    h = Math.floor(h * ratio);
  }

  canvas.width = w; canvas.height = h;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(loadedImg, 0, 0, w, h);

  // 1. Sub-Pixel Intensity-Weighted Moment Centroid on Inclinometer ROI
  const x1 = 0, x2 = Math.floor(w * 0.08);
  const y1 = Math.floor(h * 0.30), y2 = Math.floor(h * 0.40);
  const roiW = x2 - x1, roiH = y2 - y1;
  const imgData = ctx.getImageData(x1, y1, roiW, roiH).data;

  let sumWX = 0, sumWY = 0, sumW = 0;
  for (let y = 0; y < roiH; y++) {
    for (let x = 0; x < roiW; x++) {
      const idx = (y * roiW + x) * 4;
      const gray = 0.299 * imgData[idx] + 0.587 * imgData[idx+1] + 0.114 * imgData[idx+2];
      if (gray < 115) {
        const weight = (115 - gray) * (115 - gray); // Quadratic darkness weighting
        sumWX += x * weight;
        sumWY += y * weight;
        sumW += weight;
      }
    }
  }

  const dx = sumW > 0 ? ((sumWX / sumW) - (roiW / 2)) / scale : 0;
  const dy = sumW > 0 ? ((sumWY / sumW) - (roiH / 2)) / scale : 0;

  // 2. Physical Collinearity Tilt Angles (omega, phi) & GSD Calculation
  const negativeMM = 228.6;
  const mmPerPx = negativeMM / Math.max(w0, h0);
  const tiltXRad = Math.atan2(dx * mmPerPx, f);
  const tiltYRad = Math.atan2(dy * mmPerPx, f);
  const tiltDeg = (Math.hypot(tiltXRad, tiltYRad) * 180 / Math.PI).toFixed(3);
  const gsdMeters = ((H * negativeMM) / (f * Math.max(w, h))).toFixed(4);

  ctx.save();
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  // Exact tangent-based nadir offset and secant foreshortening compensation
  const secX = 1.0 / Math.cos(tiltXRad);
  const secY = 1.0 / Math.cos(tiltYRad);
  const shearX = Math.tan(tiltXRad) * (3000 / H) * 0.25;
  const shearY = Math.tan(tiltYRad) * (3000 / H) * 0.25;
  const nadirShiftX = - (f / mmPerPx) * Math.tan(tiltXRad) * 0.15 * scale;
  const nadirShiftY = - (f / mmPerPx) * Math.tan(tiltYRad) * 0.15 * scale;

  ctx.setTransform(secX, shearY, shearX, secY, nadirShiftX, nadirShiftY);
  ctx.drawImage(loadedImg, 0, 0, w, h);
  ctx.restore();

  if (sharpToggle.checked) {
    applyIsotropicSobelSharpen(ctx, w, h);
  }

  if (redMarkToggle.checked) {
    const lw = Math.max(5, Math.floor(w * 0.005));
    ctx.strokeStyle = "#00e676";
    ctx.lineWidth = lw;
    ctx.strokeRect(x1 + lw, y1, roiW - lw, roiH);

    const cx = Math.floor(x1 + (roiW / 2) + dx * scale);
    const cy = Math.floor(y1 + (roiH / 2) + dy * scale);
    const r = Math.floor(roiH * 0.45);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
    ctx.stroke();
  }

  telemetry.style.display = 'block';
  telemetry.innerHTML =
    `INPUT: ${w0}x${h0} px &rarr; OUTPUT: ${w}x${h} px (GSD: ${gsdMeters} m/px)<br>` +
    `ALTITUDE H: ${H}m | FOCAL f: ${f}mm | TILT (&omega;,&phi;): ${tiltDeg}&deg;<br>` +
    `SUB-PIXEL CENTROID dX: ${dx.toFixed(3)}px | dY: ${dy.toFixed(3)}px<br>` +
    `MODE: Collinearity Secant Ortho-Correction + Isotropic Sobel Unsharp`;
  canvas.style.display = 'block';
  controls.style.display = 'flex';
}

document.getElementById('saveJpgBtn').addEventListener('click', () => {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = '000_COLLINEARITY_RECTIFIED_MAP.jpg';
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }, 'image/jpeg', 0.98);
});

document.getElementById('savePdfBtn').addEventListener('click', () => {
  const dataUrl = canvas.toDataURL('image/jpeg', 0.98);
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>Square Aerial PDF</title><style>@page { size: 228.6mm 228.6mm; margin: 0; } body { margin: 0; } img { width: 100%; height: 100%; object-fit: contain; }</style></head><body><img src="${dataUrl}" onload="window.print();"></body></html>`);
  win.document.close();
});
</script>
</body>
</html>
